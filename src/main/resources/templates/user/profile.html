<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Hồ Sơ Cá Nhân')}"></head>
<body class="bg-light-custom font-inter">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container py-5">
        <h2 class="font-playfair text-primary-custom mb-4 text-center">Hồ Sơ Của Bạn</h2>

        <!-- Flash messages -->
        <div th:if="${thanhCong}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${thanhCong}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
            <i class="fa-solid fa-circle-xmark me-2"></i><span th:text="${loi}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-center g-4">
            <!-- Form thông tin cá nhân -->
            <div class="col-md-7">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                        <h5 class="fw-bold mb-0"><i class="fa-regular fa-id-card text-primary-custom me-2"></i>Thông Tin Cá Nhân</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/profile/update}" method="post" th:object="${nguoiDung}">
                            <div class="mb-3">
                                <label class="form-label text-muted">Họ và tên</label>
                                <input type="text" class="form-control" th:field="*{hoTen}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Email (Đăng nhập)</label>
                                <input type="email" class="form-control bg-light" th:field="*{email}" readonly>
                                <div class="form-text">Email không thể thay đổi.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Số điện thoại</label>
                                <input type="tel" class="form-control" th:field="*{soDienThoai}" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted">Địa chỉ mặc định</label>
                                <textarea class="form-control" th:field="*{diaChi}" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary-custom rounded-pill px-4">Lưu Thông Tin</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Form đổi mật khẩu -->
            <div class="col-md-5">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                        <h5 class="fw-bold mb-0"><i class="fa-solid fa-lock text-primary-custom me-2"></i>Đổi Mật Khẩu</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/profile/password}" method="post">
                            <div class="mb-3">
                                <label class="form-label text-muted">Mật khẩu hiện tại</label>
                                <input type="password" name="matKhauCu" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted">Mật khẩu mới</label>
                                <input type="password" name="matKhauMoi" class="form-control" required minlength="6">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted">Xác nhận mật khẩu mới</label>
                                <input type="password" name="xacNhanMatKhau" class="form-control" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-outline-custom rounded-pill px-4 w-100">Đổi Mật Khẩu</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
