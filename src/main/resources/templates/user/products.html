<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Sản Phẩm')}"></head>
<body class="bg-light-custom font-inter">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Page Header -->
    <div class="bg-primary-custom text-white py-5 text-center">
        <h1 class="font-playfair display-5 mb-0">Thực Đơn Bánh Ngọt</h1>
    </div>

    <div class="container py-5">
        <div class="row g-4">
            <!-- Sidebar Lọc -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">
                        <h5 class="font-playfair text-primary-custom fw-bold mb-4">Tìm Kiếm</h5>
                        <form th:action="@{/products}" method="get" class="mb-4">
                            <div class="input-group">
                                <input type="text" name="keyword" class="form-control bg-light border-0" placeholder="Tên bánh..." th:value="${keyword}">
                                <button class="btn btn-primary-custom" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                            </div>
                            <input type="hidden" name="danhMucId" th:if="${danhMucIdHienTai != null}" th:value="${danhMucIdHienTai}">
                        </form>

                        <h5 class="font-playfair text-primary-custom fw-bold mb-3">Danh Mục</h5>
                        <ul class="list-unstyled mb-0 category-list">
                            <li class="mb-2">
                                <a th:href="@{/products}" class="text-decoration-none d-block py-2 px-3 rounded-3" 
                                   th:classappend="${danhMucIdHienTai == null} ? 'bg-primary-custom text-white' : 'text-dark hover-bg-light'">
                                    Tất cả sản phẩm
                                </a>
                            </li>
                            <li class="mb-2" th:each="dm : ${danhMucs}">
                                <a th:href="@{/products(danhMucId=${dm.danhMucId}, keyword=${keyword})}" 
                                   class="text-decoration-none d-block py-2 px-3 rounded-3"
                                   th:classappend="${danhMucIdHienTai == dm.danhMucId} ? 'bg-primary-custom text-white' : 'text-dark hover-bg-light'">
                                    <i th:class="${dm.icon} + ' me-2'"></i> <span th:text="${dm.tenDanhMuc}">Danh muc</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Grid Sản Phẩm -->
            <div class="col-lg-9">
                <!-- Thông báo tìm kiếm -->
                <div class="mb-4" th:if="${keyword != null}">
                    <h5 class="fw-normal">Kết quả tìm kiếm cho: <strong th:text="${keyword}"></strong></h5>
                </div>
                
                <div class="row g-4">
                    <!-- Trống -->
                    <div class="col-12" th:if="${#lists.isEmpty(sanPhams)}">
                        <div class="alert alert-warning text-center border-0 rounded-4 py-4">
                            <i class="fa-regular fa-face-frown fs-1 mb-3 text-muted"></i>
                            <h5 class="text-muted">Không tìm thấy sản phẩm nào!</h5>
                        </div>
                    </div>

                    <!-- Item -->
                    <div class="col-md-4 col-sm-6" th:each="sp : ${sanPhams}">
                        <div class="card product-card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                            <div class="product-img-wrapper position-relative" style="height: 220px; overflow: hidden;">
                                <img th:src="${sp.hinhAnh}" class="w-100 h-100 object-fit-cover" alt="Product">
                                <div class="product-action position-absolute w-100 bottom-0 start-0 text-center pb-3">
                                    <a th:href="@{/products/{id}(id=${sp.sanPhamId})}" class="btn btn-light rounded-pill btn-sm shadow me-2"><i class="fa-regular fa-eye"></i> Xem</a>
                                    <form th:action="@{/cart/add}" method="post" class="d-inline">
                                        <input type="hidden" name="sanPhamId" th:value="${sp.sanPhamId}">
                                        <button type="submit" class="btn btn-primary-custom rounded-pill btn-sm shadow" th:disabled="${sp.soLuongTon == 0}">
                                            <i class="fa-solid fa-cart-plus"></i> Mua
                                        </button>
                                    </form>
                                </div>
                                <span th:if="${sp.soLuongTon == 0}" class="badge bg-danger position-absolute top-0 end-0 m-3 fs-6 rounded-pill">Hết hàng</span>
                            </div>
                            <div class="card-body text-center p-3">
                                <p class="text-muted small mb-1" th:text="${sp.danhMuc.tenDanhMuc}">Category</p>
                                <h6 class="card-title fw-bold mb-2 text-truncate" th:text="${sp.tenSanPham}">Name</h6>
                                <div class="price text-primary-custom fw-bold fs-6" th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT')} + ' đ'">100,000 đ</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
