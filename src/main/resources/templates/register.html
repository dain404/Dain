<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Đăng Ký')}"></head>
<body class="bg-light-custom font-inter d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="card-header bg-white text-center pt-5 pb-4 border-0">
                            <h2 class="font-playfair text-primary-custom fw-bold mb-0">Tạo Tài Khoản</h2>
                            <p class="text-muted mt-2 mb-0">Tham gia cùng chúng tôi để nhận những ưu đãi ngọt ngào</p>
                        </div>
                        <div class="card-body p-4 p-md-5 pt-0">
                            
                            <div th:if="${loi}" class="alert alert-danger rounded-3 small">
                                <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${loi}"></span>
                            </div>

                            <form th:action="@{/register}" method="post" th:object="${nguoiDung}">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small fw-bold text-uppercase">Họ và tên</label>
                                        <input type="text" th:field="*{hoTen}" class="form-control bg-light border-0 py-2" required placeholder="Nguyễn Văn A">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small fw-bold text-uppercase">Số điện thoại</label>
                                        <input type="tel" th:field="*{soDienThoai}" class="form-control bg-light border-0 py-2" required placeholder="09xxxx">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold text-uppercase">Email</label>
                                    <input type="email" th:field="*{email}" class="form-control bg-light border-0 py-2" required placeholder="email@example.com">
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold text-uppercase">Địa chỉ</label>
                                    <textarea th:field="*{diaChi}" class="form-control bg-light border-0 py-2" rows="2" required placeholder="Địa chỉ nhận hàng mặc định"></textarea>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small fw-bold text-uppercase">Mật khẩu</label>
                                        <input type="password" name="matKhau" class="form-control bg-light border-0 py-2" required minlength="6" placeholder="Ít nhất 6 ký tự">
                                    </div>
                                    <div class="col-md-6">
                                        <!-- Do NguoiDung entity không có xacNhanMatKhau, có thể bỏ qua validation ở phía HTML hoặc thêm custom, tạm dùng HTML required -->
                                        <label class="form-label text-muted small fw-bold text-uppercase">Xác nhận mật khẩu</label>
                                        <input type="password" name="xacNhanMatKhau" class="form-control bg-light border-0 py-2" required minlength="6" placeholder="Nhập lại mật khẩu">
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary-custom btn-lg w-100 rounded-pill shadow-sm mb-4">ĐĂNG KÝ NGAY</button>
                                
                                <div class="text-center text-muted">
                                    Đã có tài khoản? <a th:href="@{/login}" class="text-primary-custom fw-bold text-decoration-none">Đăng nhập</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
