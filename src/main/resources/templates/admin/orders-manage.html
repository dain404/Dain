<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Quản Lý Đơn Hàng')}"></head>
<body class="bg-light font-inter">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container-fluid py-4">
        <div class="row g-4">
            
            <!-- Sidebar Admin -->
            <div class="col-lg-2">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-3">
                        <h6 class="text-uppercase fw-bold text-muted mb-3 px-3">Quản Trị</h6>
                        <ul class="nav flex-column gap-1 admin-nav">
                            <li class="nav-item">
                                <a th:href="@{/admin}" class="nav-link rounded-3 text-dark hover-bg-light px-3 py-2">
                                    <i class="fa-solid fa-chart-pie me-2 w-20px"></i>Tổng quan
                                </a>
                            </li>
                            <li class="nav-item mt-1">
                                <a th:href="@{/admin/products}" class="nav-link rounded-3 text-dark hover-bg-light px-3 py-2">
                                    <i class="fa-solid fa-cake-candles me-2 w-20px"></i>Sản phẩm & Danh mục
                                </a>
                            </li>
                            <li class="nav-item mt-1">
                                <a th:href="@{/admin/orders}" class="nav-link rounded-3 active text-primary-custom bg-light-custom fw-bold px-3 py-2">
                                    <i class="fa-solid fa-file-invoice-dollar me-2 w-20px"></i>Đơn hàng
                                </a>
                            </li>
                            <li class="nav-item mt-1">
                                <a th:href="@{/admin/users}" class="nav-link rounded-3 text-dark hover-bg-light px-3 py-2">
                                    <i class="fa-solid fa-users me-2 w-20px"></i>Khách hàng
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="col-lg-10">
                
                <!-- Flash messages -->
                <div th:if="${thanhCong}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i><span th:text="${thanhCong}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="font-playfair text-primary-custom mb-0">Quản Lý Đơn Hàng</h3>
                    <a th:href="@{/admin/export/revenue(month=${#temporals.month(#temporals.createNow())}, year=${#temporals.year(#temporals.createNow())})}" class="btn btn-success rounded-pill shadow-sm">
                        <i class="fa-solid fa-file-excel me-2"></i>Xuất Excel tháng này
                    </a>
                </div>

                <!-- Bảng Danh sách đơn hàng -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4">Mã ĐH</th>
                                        <th>Ngày đặt</th>
                                        <th>Khách hàng</th>
                                        <th>Tổng tiền</th>
                                        <th>Trạng thái hiện tại</th>
                                        <th class="text-end pe-4">Cập nhật trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="dh : ${donHangs}">
                                        <td class="ps-4 fw-bold">#<span th:text="${dh.donHangId}"></span></td>
                                        <td th:text="${#temporals.format(dh.ngayDatHang, 'dd/MM/yyyy HH:mm')}">Date</td>
                                        <td>
                                            <div class="fw-bold" th:text="${dh.nguoiDung.hoTen}">Name</div>
                                            <div class="small text-muted" th:text="${dh.soDienThoaiNhan}">Phone</div>
                                        </td>
                                        <td class="fw-medium text-primary-custom" th:text="${#numbers.formatDecimal(dh.tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'">Total</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${dh.trangThai.name() == 'CHO_XAC_NHAN' ? 'bg-warning text-dark' : 
                                                                 (dh.trangThai.name() == 'HOAN_THANH' ? 'bg-success' : 
                                                                 (dh.trangThai.name() == 'HUY' ? 'bg-danger' : 'bg-info'))}"
                                                  th:text="${dh.trangThai.tenHienThi}">Status</span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <div class="d-flex gap-2 justify-content-end align-items-center">
                                                <!-- Xuất PDF -->
                                                <a th:href="@{/admin/orders/{id}/invoice(id=${dh.donHangId})}" class="btn btn-sm btn-outline-danger rounded-pill shadow-sm" title="Xuất Hóa Đơn PDF">
                                                    <i class="fa-solid fa-file-pdf"></i> Xuất PDF
                                                </a>
                                                <!-- Form cập nhật trạng thái -->
                                                <form th:action="@{/admin/orders/{id}/status(id=${dh.donHangId})}" method="post" class="d-flex gap-2 mb-0">
                                                    <select name="trangThai" class="form-select form-select-sm w-auto rounded-pill" th:disabled="${dh.trangThai.name() == 'HOAN_THANH' || dh.trangThai.name() == 'HUY'}">
                                                        <option th:each="tt : ${trangThais}" th:value="${tt}" th:text="${tt.tenHienThi}" th:selected="${tt == dh.trangThai}"></option>
                                                    </select>
                                                    <button type="submit" class="btn btn-sm btn-primary-custom rounded-pill shadow-sm" th:disabled="${dh.trangThai.name() == 'HOAN_THANH' || dh.trangThai.name() == 'HUY'}">Lưu</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(donHangs)}">
                                        <td colspan="6" class="text-center text-muted py-4">Chưa có đơn hàng nào</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link rounded-start-pill" th:href="@{/admin/orders(page=${currentPage - 1})}">Trước</a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link text-muted bg-light">Trang <span th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span></span>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link rounded-end-pill" th:href="@{/admin/orders(page=${currentPage + 1})}">Sau</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
