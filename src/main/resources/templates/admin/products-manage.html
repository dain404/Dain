<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Quản Lý Sản Phẩm')}"></head>
<body class="bg-light font-inter">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container-fluid py-4">
        <div class="row g-4">
            
            <!-- Sidebar Admin -->
            <div class="col-lg-2">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-3">
                        <h6 class="text-uppercase fw-bold text-muted mb-3 px-3">Quản Trị</h6>
                        <ul class="nav flex-column gap-1 admin-nav">
                            <li class="nav-item">
                                <a th:href="@{/admin}" class="nav-link rounded-3 text-dark hover-bg-light px-3 py-2">
                                    <i class="fa-solid fa-chart-pie me-2 w-20px"></i>Tổng quan
                                </a>
                            </li>
                            <li class="nav-item mt-1">
                                <a th:href="@{/admin/products}" class="nav-link rounded-3 active text-primary-custom bg-light-custom fw-bold px-3 py-2">
                                    <i class="fa-solid fa-cake-candles me-2 w-20px"></i>Sản phẩm & Danh mục
                                </a>
                            </li>
                            <li class="nav-item mt-1">
                                <a th:href="@{/admin/orders}" class="nav-link rounded-3 text-dark hover-bg-light px-3 py-2">
                                    <i class="fa-solid fa-file-invoice-dollar me-2 w-20px"></i>Đơn hàng
                                </a>
                            </li>
                            <li class="nav-item mt-1">
                                <a th:href="@{/admin/users}" class="nav-link rounded-3 text-dark hover-bg-light px-3 py-2">
                                    <i class="fa-solid fa-users me-2 w-20px"></i>Khách hàng
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="col-lg-10">
                
                <!-- Flash messages -->
                <div th:if="${thanhCong}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i><span th:text="${thanhCong}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Header Actions -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="font-playfair text-primary-custom mb-0">Quản Lý Sản Phẩm</h3>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-custom rounded-pill" data-bs-toggle="modal" data-bs-target="#modalDanhMuc">
                            <i class="fa-solid fa-plus me-2"></i>Thêm Danh Mục
                        </button>
                        <button class="btn btn-primary-custom rounded-pill" data-bs-toggle="modal" data-bs-target="#modalSanPham">
                            <i class="fa-solid fa-plus me-2"></i>Thêm Sản Phẩm
                        </button>
                    </div>
                </div>

                <!-- Bảng Danh sách sản phẩm -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4">Sản phẩm</th>
                                        <th>Danh mục</th>
                                        <th>Giá</th>
                                        <th>Tồn kho</th>
                                        <th>Trạng thái</th>
                                        <th class="text-end pe-4">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="sp : ${sanPhams}">
                                        <td class="ps-4">
                                            <div class="d-flex align-items-center">
                                                <img th:src="${sp.hinhAnh}" class="rounded-3 me-3" style="width: 50px; height: 50px; object-fit: cover;">
                                                <span class="fw-bold" th:text="${sp.tenSanPham}"></span>
                                            </div>
                                        </td>
                                        <td th:text="${sp.danhMuc.tenDanhMuc}">Category</td>
                                        <td th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT') + ' đ'}">Price</td>
                                        <td th:text="${sp.soLuongTon}">0</td>
                                        <td>
                                            <span class="badge" th:classappend="${sp.trangThai} ? 'bg-success' : 'bg-secondary'" th:text="${sp.trangThai} ? 'Đang bán' : 'Đã ẩn'"></span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <!-- Nút sửa (bật modal và điền sẵn thông tin sản phẩm bằng data-attributes) -->
                                            <button type="button" class="btn btn-sm btn-outline-primary rounded-circle me-1 btn-edit" title="Sửa"
                                                    data-bs-toggle="modal" data-bs-target="#modalSanPham"
                                                    th:data-id="${sp.sanPhamId}"
                                                    th:data-ten="${sp.tenSanPham}"
                                                    th:data-danhmuc="${sp.danhMuc != null ? sp.danhMuc.danhMucId : ''}"
                                                    th:data-gia="${sp.gia}"
                                                    th:data-ton="${sp.soLuongTon}"
                                                    th:data-trangthai="${sp.trangThai}"
                                                    th:data-hinhanh="${sp.hinhAnh}"
                                                    th:data-mota="${sp.moTa}">
                                                <i class="fa-solid fa-pen-to-square"></i>
                                            </button>
                                            
                                            <!-- Form ẩn/xóa (POST an toàn để bảo vệ CSRF) -->
                                            <form th:action="@{/admin/products/delete/{id}(id=${sp.sanPhamId})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn thay đổi trạng thái sản phẩm này?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle" title="Ẩn/Xóa"><i class="fa-regular fa-trash-can"></i></button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(sanPhams)}">
                                        <td colspan="6" class="text-center text-muted py-4">Chưa có sản phẩm nào</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link rounded-start-pill" th:href="@{/admin/products(page=${currentPage - 1})}">Trước</a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link text-muted bg-light">Trang <span th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span></span>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link rounded-end-pill" th:href="@{/admin/products(page=${currentPage + 1})}">Sau</a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Sản Phẩm -->
    <div class="modal fade" id="modalSanPham" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title font-playfair text-primary-custom fw-bold" id="modalSanPhamTitle">Thêm Sản Phẩm Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form th:action="@{/admin/products/save}" method="post" th:object="${sanPhamMoi}" enctype="multipart/form-data">
                        <!-- Id ẩn phục vụ cập nhật -->
                        <input type="hidden" name="sanPhamId" id="editSanPhamId">

                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label text-muted small fw-bold">Tên sản phẩm</label>
                                <input type="text" th:field="*{tenSanPham}" id="editTenSanPham" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Danh mục</label>
                                <select name="danhMucId" id="editDanhMucId" class="form-select" required>
                                    <option value="">Chọn danh mục</option>
                                    <option th:each="dm : ${danhMucs}" th:value="${dm.danhMucId}" th:text="${dm.tenDanhMuc}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Giá bán (VNĐ)</label>
                                <input type="number" th:field="*{gia}" id="editGia" class="form-control" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Số lượng tồn</label>
                                <input type="number" th:field="*{soLuongTon}" id="editSoLuongTon" class="form-control" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Trạng thái</label>
                                <select th:field="*{trangThai}" id="editTrangThai" class="form-select">
                                    <option value="true">Đang bán</option>
                                    <option value="false">Ẩn</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">URL Hình ảnh</label>
                                <input type="text" th:field="*{hinhAnh}" id="editHinhAnh" class="form-control" placeholder="https://...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Hoặc Tải ảnh lên</label>
                                <input type="file" name="imageFile" accept="image/*" class="form-control">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Mô tả</label>
                            <textarea th:field="*{moTa}" id="editMoTa" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-light rounded-pill px-4 me-2" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary-custom rounded-pill px-4">Lưu Sản Phẩm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Danh Mục -->
    <div class="modal fade" id="modalDanhMuc" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title font-playfair text-primary-custom fw-bold">Thêm Danh Mục Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form th:action="@{/admin/categories/save}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Tên danh mục</label>
                            <input type="text" name="tenDanhMuc" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Icon (FontAwesome Class)</label>
                            <input type="text" name="icon" class="form-control" placeholder="fa-solid fa-cake-candles" required>
                            <div class="form-text">Ví dụ: fa-solid fa-bread-slice</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">Mô tả</label>
                            <textarea name="moTa" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-light rounded-pill px-4 me-2" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary-custom rounded-pill px-4">Lưu Danh Mục</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap Modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS để đổ dữ liệu khi sửa sản phẩm -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const modalSanPham = document.getElementById('modalSanPham');
            const modalTitle = document.getElementById('modalSanPhamTitle');
            
            // Lắng nghe sự kiện click các nút sửa
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', function () {
                    modalTitle.textContent = 'Cập nhật sản phẩm';
                    
                    document.getElementById('editSanPhamId').value = this.getAttribute('data-id');
                    document.getElementById('editTenSanPham').value = this.getAttribute('data-ten');
                    document.getElementById('editDanhMucId').value = this.getAttribute('data-danhmuc');
                    document.getElementById('editGia').value = this.getAttribute('data-gia');
                    document.getElementById('editSoLuongTon').value = this.getAttribute('data-ton');
                    document.getElementById('editTrangThai').value = this.getAttribute('data-trangthai');
                    document.getElementById('editHinhAnh').value = this.getAttribute('data-hinhanh');
                    document.getElementById('editMoTa').value = this.getAttribute('data-mota');
                    
                    document.getElementById('editHinhAnh').required = false;
                });
            });

            // Reset form khi bấm Thêm sản phẩm
            const btnAddSanPham = document.querySelector('[data-bs-target="#modalSanPham"]:not(.btn-edit)');
            if (btnAddSanPham) {
                btnAddSanPham.addEventListener('click', function () {
                    modalTitle.textContent = 'Thêm Sản Phẩm Mới';
                    document.getElementById('editSanPhamId').value = '';
                    document.getElementById('editTenSanPham').value = '';
                    document.getElementById('editDanhMucId').value = '';
                    document.getElementById('editGia').value = '';
                    document.getElementById('editSoLuongTon').value = '';
                    document.getElementById('editTrangThai').value = 'true';
                    document.getElementById('editHinhAnh').value = '';
                    document.getElementById('editMoTa').value = '';
                    document.getElementById('editHinhAnh').required = true;
                });
            }
        });
    </script>
</body>
</html>
