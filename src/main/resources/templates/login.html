<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head('Đăng Nhập')}"></head>
<body class="bg-light-custom font-inter d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="card-header bg-white text-center pt-5 pb-4 border-0">
                            <h2 class="font-playfair text-primary-custom fw-bold mb-0">Đăng Nhập</h2>
                            <p class="text-muted mt-2 mb-0">Chào mừng bạn trở lại với MeDoNgot</p>
                        </div>
                        <div class="card-body p-4 p-md-5 pt-0">
                            
                            <!-- Báo lỗi từ Spring Security -->
                            <div th:if="${param.error}" class="alert alert-danger rounded-3 small">
                                <i class="fa-solid fa-circle-exclamation me-1"></i> Email hoặc mật khẩu không đúng!
                            </div>
                            <!-- Báo logout thành công -->
                            <div th:if="${param.logout}" class="alert alert-success rounded-3 small">
                                <i class="fa-solid fa-check-circle me-1"></i> Bạn đã đăng xuất thành công.
                            </div>
                            <!-- Báo đăng ký thành công -->
                            <div th:if="${thanhCong}" class="alert alert-success rounded-3 small">
                                <i class="fa-solid fa-check-circle me-1"></i> <span th:text="${thanhCong}"></span>
                            </div>

                            <form th:action="@{/login}" method="post">
                                <div class="mb-4">
                                    <label class="form-label text-muted small fw-bold text-uppercase">Email</label>
                                    <input type="email" name="email" class="form-control form-control-lg bg-light border-0" required placeholder="Nhập email của bạn">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small fw-bold text-uppercase d-flex justify-content-between">
                                        Mật khẩu
                                        <a href="#" class="text-primary-custom text-decoration-none text-capitalize fw-normal">Quên mật khẩu?</a>
                                    </label>
                                    <input type="password" name="matKhau" class="form-control form-control-lg bg-light border-0" required placeholder="Nhập mật khẩu">
                                </div>
                                
                                <button type="submit" class="btn btn-primary-custom btn-lg w-100 rounded-pill shadow-sm mb-4">ĐĂNG NHẬP</button>
                                
                                <div class="text-center text-muted">
                                    Chưa có tài khoản? <a th:href="@{/register}" class="text-primary-custom fw-bold text-decoration-none">Đăng ký ngay</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
