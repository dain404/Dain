# ==========================================
# CẤU HÌNH ỨNG DỤNG BAKERY SHOP
# ==========================================
spring.application.name=bakery_shop

# ==========================================
# CẤU HÌNH SQL SERVER
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BanhNgotDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ==========================================
# CẤU HÌNH THYMELEAF
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==========================================
# CẤU HÌNH SERVER
# ==========================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# CẤU HÌNH MAIL (JavaMailSender)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ==========================================
# CẤU HÌNH MULTIPART (upload ảnh)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/products

# ==========================================
# CẤU HÌNH LOGGING
# ==========================================
logging.level.com.example.bakery_shop=DEBUG
logging.level.org.springframework.security=INFO

# ==========================================
# CẤU HÌNH CACHE (Caffeine)
# ==========================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=10m
spring.cache.cache-names=san-pham,danh-muc

# ==========================================
# CẤU HÌNH API TỶ GIÁ
# ==========================================
exchangerate.api.url=https://open.er-api.com/v6/latest/USD
exchangerate.cache.ttl=3600
